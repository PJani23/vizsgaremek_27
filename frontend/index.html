<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptkereső</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">ReceptKereső</div>
    <div class="header-buttons">
        <button class="btn" onclick="toggleTheme()">🌙 Mód váltás</button>
        <button class="btn">Kedvencek</button>
        <button class="btn">Bevásárlólista</button>
    </div>
</header>

<section class="hero">
    <h1>Mit főzzünk ma?</h1>
    <p>Add meg a hozzávalókat, és megmutatjuk, milyen recepteket készíthetsz el.</p>

    <div class="quick-buttons">
        <div class="quick-btn">Gyors receptek</div>
        <div class="quick-btn">Tészták</div>
        <div class="quick-btn">Egészséges</div>
        <div class="quick-btn">Desszertek</div>
        <div class="quick-btn">Olcsó ételek</div>
    </div>
</section>

<main class="container">
    <div class="search-card">
        <label for="hozzavalokInput">Hozzávalók (vesszővel elválasztva)</label>
        <div class="input-row">
            <input id="hozzavalokInput" type="text" placeholder="pl: tojás, liszt, tej">
            <button onclick="meghivas()">Keresés</button>
        </div>

        <div id="talalatok"></div>
    </div>

    <div id="receptReszletek" class="detail-card" style="display:none;"></div>
</main>

<footer>
    Receptkereső – 2026
</footer>

<script>
    function toggleTheme() {
        document.documentElement.classList.toggle("dark");
    }

    const json = [
        {
            "nev": "Rántotta",
            "kep": "images/rantotta.jpg",
            "ido": 10,
            "nehezseg": "könnyű",
            "adag": 1,
            "hozzavalok": ["tojás", "só", "bors", "olaj"],
            "lepesek": [
                "A tojásokat egy tálban felverjük.",
                "Sózzuk, borsozzuk.",
                "Olajat hevítünk a serpenyőben.",
                "A tojást beleöntjük és folyamatosan keverjük.",
                "3-4 perc alatt készre sütjük."
            ]
        },
        {
            "nev": "Palacsinta",
            "kep": "images/palacsinta.jpg",
            "ido": 25,
            "nehezseg": "közepes",
            "adag": 4,
            "hozzavalok": ["liszt", "tojás", "tej", "cukor", "olaj", "só"],
            "lepesek": [
                "A lisztet, tojást, tejet és cukrot összekeverjük.",
                "Hozzáadunk egy csipet sót.",
                "A tésztát 10 percig pihentetjük.",
                "Olajjal kikent serpenyőben kisütjük a palacsintákat."
            ]
        }
    ];

    function meghivas() {
        const div = document.getElementById("talalatok");
        div.innerHTML = "";

        for (const e of json) {
            div.innerHTML += `
                <div class="recept" onclick="mutasdReceptReszletek('${e.nev}')">
                    <h3>${e.nev}</h3>
                    <div class="meta">Idő: ${e.ido} perc · Nehézség: ${e.nehezseg}</div>
                    <div><b>Hozzávalók:</b> ${e.hozzavalok.join(", ")}</div>
                </div>
            `;
        }
    }

    function mutasdReceptReszletek(nev) {
        const recept = json.find(r => r.nev === nev);
        const detailDiv = document.getElementById("receptReszletek");

        detailDiv.style.display = "block";

        detailDiv.innerHTML = `
            <div class="detail-header">
                <img src="${recept.kep}" alt="${recept.nev}">
                <div class="detail-info">
                    <h2>${recept.nev}</h2>
                    <div class="meta">Elkészítési idő: ${recept.ido} perc</div>
                    <div class="meta">Nehézség: ${recept.nehezseg}</div>
                    <div class="meta">Adagok száma: ${recept.adag}</div>
                </div>
            </div>

            <div class="detail-section">
                <h3>Hozzávalók</h3>
                <ul>
                    ${recept.hozzavalok.map(h => `<li>${h}</li>`).join("")}
                </ul>
            </div>

            <div class="detail-section">
                <h3>Elkészítés lépései</h3>
                <ul>
                    ${recept.lepesek.map(l => `<li>${l}</li>`).join("")}
                </ul>
            </div>
        `;
    }
</script>

</body>
</html>
