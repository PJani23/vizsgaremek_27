<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptkereső</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>
<body>

<header>
    <div class="logo">ReceptKereső</div>
    <div class="header-buttons">
        <button class="btn" onclick="toggleTheme()" id="napocska">🌙 Mód váltás</button>
        <button class="btn">Kedvencek</button>
        <button class="btn">Bevásárlólista</button>
    </div>
</header>

<section class="hero">
    <h1>Mit főzzünk ma?</h1>
    <p>Add meg a hozzávalókat, és megmutatjuk, milyen recepteket készíthetsz el.</p>

    <div class="quick-buttons">
        <div class="quick-btn">Gyors receptek</div>
        <div class="quick-btn">Tészták</div>
        <div class="quick-btn">Egészséges</div>
        <div class="quick-btn">Desszertek</div>
        <div class="quick-btn">Olcsó ételek</div>
    </div>
</section>

<main class="container">
    <div class="search-card">
        <label for="hozzavalokInput">Hozzávalók (vesszővel elválasztva)</label>
        <div class="input-row">
            <input id="hozzavalokInput" type="text" placeholder="pl: tojás, liszt, tej">
            <button onclick="megjelenit()">Keresés</button>
        </div>

        <div id="talalatok">
            
        </div>
    </div>

    <div id="receptReszletek" class="detail-card" style="display:none;"></div>
</main>

<footer>
    Receptkereső – 2026
</footer>



</body>
</html>
