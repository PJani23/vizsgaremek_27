<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptkereső</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">ReceptKereső</div>
    <div class="header-buttons">
        <button class="btn" onclick="toggleTheme()">🌙 Mód váltás</button>
        <button class="btn">Kedvencek</button>
        <button class="btn">Bevásárlólista</button>
    </div>
</header>

<section class="hero">
    <h1>Mit főzzünk ma?</h1>
    <p>Add meg a hozzávalókat, és megmutatjuk, milyen recepteket készíthetsz el.</p>

    <div class="quick-buttons">
        <div class="quick-btn">Gyors receptek</div>
        <div class="quick-btn">Tészták</div>
        <div class="quick-btn">Egészséges</div>
        <div class="quick-btn">Desszertek</div>
        <div class="quick-btn">Olcsó ételek</div>
    </div>
</section>

<main class="container">
    <div class="search-card">
        <label for="hozzavalokInput">Hozzávalók (vesszővel elválasztva)</label>
        <div class="input-row">
            <input id="hozzavalokInput" type="text" placeholder="pl: tojás, liszt, tej">
            <button onclick="rego()">Keresés</button>
        </div>

        <div id="talalatok"></div>
    </div>

    <div id="receptReszletek" class="detail-card" style="display:none;"></div>

    <h2 style="margin-top: 30px;">Kategóriák</h2>
    <div class="categories">
        <div class="cat-card">10 perc alatt</div>
        <div class="cat-card">Kezdőknek</div>
        <div class="cat-card">Népszerű</div>
        <div class="cat-card">Vegetáriánus</div>
        <div class="cat-card">Reggeli</div>
        <div class="cat-card">Ebéd</div>
        <div class="cat-card">Vacsora</div>
    </div>
</main>

<footer>
    Receptkereső – 2026
</footer>

<script>
    let utolsoHozzavalok = [];

    function toggleTheme() {
        document.documentElement.classList.toggle("dark");
    }

    async function kereses() {
        const input = document.getElementById("hozzavalokInput").value;
        const hozzavalok = input.split(",").map(x => x.trim()).filter(x => x);
        utolsoHozzavalok = hozzavalok;

        const div = document.getElementById("talalatok");
        const detailDiv = document.getElementById("receptReszletek");
        div.innerHTML = "";
        detailDiv.style.display = "none";
        detailDiv.innerHTML = "";

        if (hozzavalok.length === 0) {
            //div.innerHTML = '<p class="meta">Adj meg legalább egy hozzávalót.</p>';
            const json = JSON.parse(
[
  {
    "nev": "Rántotta",
    "kep": "images/rantotta.jpg",
    "ido": 10,
    "nehezseg": "könnyű",
    "adag": 1,
    "hozzavalok": ["tojás", "só", "bors", "olaj"],
    "lepesek": [
      "A tojásokat egy tálban felverjük.",
      "Sózzuk, borsozzuk.",
      "Olajat hevítünk a serpenyőben.",
      "A tojást beleöntjük és folyamatosan keverjük.",
      "3-4 perc alatt készre sütjük."
    ],
    "tulajdonsag": [
      "egyszerű"
    ]
  },
  {
    "nev": "Palacsinta",
    "kep": "images/palacsinta.jpg",
    "ido": 25,
    "nehezseg": "közepes",
    "adag": 4,
    "hozzavalok": ["liszt", "tojás", "tej", "cukor", "olaj", "só"],
    "lepesek": [
      "A lisztet, tojást, tejet és cukrot összekeverjük.",
      "Hozzáadunk egy csipet sót.",
      "A tésztát 10 percig pihentetjük.",
      "Olajjal kikent serpenyőben kisütjük a palacsintákat."
    ],
    "tulajdonsag": [
      "egyszerű"
    ]
  }
])
const d =  document.getElementById("talalatok").innerHTML
function rego() {
    for (const a of json) {
    `
        <div class="recept">
            <h2>${json[a].nev}</h2>
            <img src="${json[a].kep}" alt="kep">
            <p>${json[a].lepesek}</p>
        </div>
    `
}
}
            return;
        }

        try {
            const response = await fetch("/kereses", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ hozzavalok })
            });

            const receptek = await response.json();

            if (!receptek.length) {
                div.innerHTML = '<p class="meta">Nincs találat.</p>';
                return;
            }

            receptek.forEach(r => {
                const card = document.createElement("div");
                card.className = "recept";
                card.innerHTML = `
                    <h3>${r.nev}</h3>
                    <div class="meta">Idő: ${r.ido} perc · Nehézség: ${r.nehezseg}</div>
                    <div><b>Hozzávalók:</b> ${r.hozzavalok.join(", ")}</div>
                `;
                card.onclick = () => mutasdReceptReszletek(r.nev);
                div.appendChild(card);
            });
        } catch (e) {
            div.innerHTML = '<p class="meta">Hiba történt. Ellenőrizd a backend futását.</p>';
        }
    }

    async function mutasdReceptReszletek(nev) {
        try {
            const res = await fetch(`/recept/${encodeURIComponent(nev)}`);
            const recept = await res.json();

            const detailDiv = document.getElementById("receptReszletek");
            detailDiv.style.display = "block";

            const megvannak = recept.hozzavalok.filter(h => utolsoHozzavalok.includes(h));
            const hianyzok = recept.hozzavalok.filter(h => !utolsoHozzavalok.includes(h));

            detailDiv.innerHTML = `
                <div class="detail-header">
                    <img src="${recept.kep}" alt="${recept.nev}">
                    <div class="detail-info">
                        <h2>${recept.nev}</h2>
                        <div class="meta">Elkészítési idő: ${recept.ido} perc</div>
                        <div class="meta">Nehézség: ${recept.nehezseg}</div>
                        <div class="meta">Adagok száma: ${recept.adag}</div>
                    </div>
                </div>

                <div class="detail-section">
                    <h3>Hozzávalók</h3>
                    <ul>
                        ${recept.hozzavalok.map(h => `<li>${h}</li>`).join("")}
                    </ul>
                </div>

                <div class="detail-section">
                    <h3>Elkészítés lépései</h3>
                    <ul>
                        ${recept.lepesek.map(l => `<li>${l}</li>`).join("")}
                    </ul>
                </div>

                <div class="detail-section">
                    <h3>Mely hozzávalók vannak meg?</h3>
                    ${megvannak.length
                        ? `<ul>${megvannak.map(h => `<li>${h}</li>`).join("")}</ul>`
                        : "<p>Ehhez a recepthez jelenleg egy hozzávaló sincs meg.</p>"}
                </div>

                <div class="detail-section">
                    <h3>Mely hozzávalók hiányoznak?</h3>
                    ${hianyzok.length
                        ? `<ul>${hianyzok.map(h => `<li>${h}</li>`).join("")}</ul>`
                        : "<p>Minden szükséges hozzávaló rendelkezésre áll.</p>"}
                </div>
            `;
        } catch (e) {
            console.error(e);
        }
    }
</script>

</body>
</html>
